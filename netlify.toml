# Netlify settings for IoT Automation
[build]
  command   = "npm install --prefix client && npm run build --prefix client"
  publish   = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# The React form calls /api/contact -> run the Netlify Function
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# Single-page app fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
